<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="10,000 SA:MP RP names in Firstname_Lastname format. Search, randomize and copy names."><title>SAMP Names — 10,000 RP Names</title><style>*{box-sizing:border-box}body{margin:0;background:#090b10;color:#eef2ff;font-family:Inter,Arial,sans-serif}header{padding:28px 7%;background:linear-gradient(135deg,#111827,#0b1220);border-bottom:1px solid #263244}h1{margin:0;font-size:42px}.accent{color:#7c5cff}.wrap{max-width:1150px;margin:auto;padding:30px 20px}.tools{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px;margin:20px 0}input,select,button{border:1px solid #303b4f;background:#111827;color:#fff;padding:13px;border-radius:10px;font-size:15px}button{cursor:pointer;background:#7c5cff;border-color:#7c5cff;font-weight:700}button:hover{filter:brightness(1.12)}.stats{color:#9ca8bb;margin:12px 0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.card{background:#101622;border:1px solid #202b3c;border-radius:12px;padding:15px;display:flex;align-items:center;justify-content:space-between;gap:10px}.name{font-weight:700;word-break:break-all}.copy{padding:8px 11px;font-size:13px}.pager{display:flex;justify-content:center;gap:10px;margin:25px 0}footer{text-align:center;color:#7f8da3;padding:30px}@media(max-width:750px){.tools{grid-template-columns:1fr 1fr}h1{font-size:32px}}@media(max-width:480px){.tools{grid-template-columns:1fr}} </style></head><body><header><div class="wrap"><h1>SAMP <span class="accent">Names</span></h1><p>10,000 clean RP-style Firstname_Lastname combinations.</p></div></header><main class="wrap"><div class="tools"><input id="q" placeholder="Search names..." oninput="render()"><select id="first" onchange="render()"><option value="">All first names</option></select><select id="last" onchange="render()"><option value="">All surnames</option></select><button onclick="randomName()">🎲 Random</button></div><div class="stats" id="stats"></div><div class="grid" id="grid"></div><div class="pager"><button onclick="prev()">← Previous</button><button onclick="next()">Next →</button></div></main><footer>Made for SA:MP RP name inspiration • Copy any name with one click</footer><script>const first=['John','Michael','James','William','David','Robert','Thomas','Daniel','Christopher','Matthew','Anthony','Joseph','Andrew','Joshua','Ryan','Brandon','Kevin','Brian','Jason','Justin','Eric','Steven','Adam','Jonathan','Nicholas','Samuel','Charles','Benjamin','Alexander','Ethan','Nathan','Dylan','Logan','Lucas','Mason','Jacob','Henry','Jack','Owen','Gabriel','Liam','Noah','Caleb','Isaac','Luke','Carter','Wyatt','Jayden','Connor','Adrian','Cameron','Jordan','Austin','Tyler','Evan','Aaron','Marcus','Derek','Kyle','Nathaniel','Cole','Dominic','Ian','Colin','Zachary','Patrick','Sean','Trevor','Victor','Vincent','Wesley','Xavier','Edward','Richard','George','Albert','Arthur','Alfred','Frank','Raymond','Martin','Scott','Peter','Philip','Simon','Louis','Leo','Leonardo','Sebastian','Julian','Damian','Maxwell','Harrison','Hunter','Blake','Darren','Dwayne','Leonard','Frederick','Gregory'];const last=['Smith','Johnson','Williams','Brown','Jones','Garcia','Miller','Davis','Rodriguez','Martinez','Hernandez','Lopez','Gonzalez','Wilson','Anderson','Thomas','Taylor','Moore','Jackson','Martin','Lee','Perez','Thompson','White','Harris','Sanchez','Clark','Ramirez','Lewis','Robinson','Walker','Young','Allen','King','Wright','Scott','Torres','Nguyen','Hill','Flores','Green','Adams','Nelson','Baker','Hall','Rivera','Campbell','Mitchell','Carter','Roberts','Gomez','Phillips','Evans','Turner','Diaz','Parker','Cruz','Edwards','Collins','Reyes','Stewart','Morris','Morales','Murphy','Cook','Rogers','Gutierrez','Ortiz','Morgan','Cooper','Peterson','Bailey','Reed','Kelly','Howard','Ramos','Kim','Cox','Ward','Richardson','Watson','Brooks','Chavez','Wood','James','Bennett','Gray','Mendoza','Ruiz','Hughes','Price','Alvarez','Castillo','Sanders','Patel','Myers','Long','Ross','Foster','Jimenez'];const names=[];for(const f of first)for(const l of last)names.push(f+'_'+l);let page=0;const per=100;const q=document.getElementById('q'),grid=document.getElementById('grid');for(const x of first)document.getElementById('first').innerHTML+=`<option>${x}</option>`;for(const x of last)document.getElementById('last').innerHTML+=`<option>${x}</option>`;function filtered(){const s=q.value.toLowerCase(),f=document.getElementById('first').value,l=document.getElementById('last').value;return names.filter(n=>(!s||n.toLowerCase().includes(s))&&(!f||n.startsWith(f+'_'))&&(!l||n.endsWith('_'+l)))}function render(){const a=filtered();const pages=Math.max(1,Math.ceil(a.length/per));if(page>=pages)page=pages-1;grid.innerHTML=a.slice(page*per,(page+1)*per).map(n=>`<div class="card"><span class="name">${n}</span><button class="copy" onclick="copyName('${n}')">Copy</button></div>`).join('');document.getElementById('stats').textContent=`${a.length.toLocaleString()} names • Page ${page+1} / ${pages}`;}function copyName(n){navigator.clipboard.writeText(n);event.target.textContent='Copied!';setTimeout(()=>event.target.textContent='Copy',800)}function randomName(){const a=filtered();const n=a[Math.floor(Math.random()*a.length)]||names[Math.floor(Math.random()*names.length)];navigator.clipboard.writeText(n);alert('Copied: '+n)}function next(){page++;render()}function prev(){page=Math.max(0,page-1);render()}render();</script></body></html>
